<style>
:root{

@media (prefers-color-scheme: dark){

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);

.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{padding:48px 0 24px}
.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--accent);font-weight:700}
h1{font-size:26px;margin:8px 0 4px;letter-spacing:-.02em}
.meta{color:var(--sub);font-size:14px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 0}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 16px}
.stat b{font-size:20px;margin-right:6px}
.stat span{color:var(--sub);font-size:13px}
.notice{margin:16px 0 0;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:24px 0 12px}
.tools input,.tools select{font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;

.tools input{flex:1;min-width:180px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--sub);letter-spacing:.04em;background:var(--row);position:sticky;top:0;cursor:pointer;user-select:none;white-space:nowrap}
th[data-sort]::after{content:" ↕";opacity:.4}
tr:last-child td{border-bottom:none}
tbody tr:nth-child(even) td{background:var(--row)}
td.name{font-weight:700;white-space:nowrap}
td.num{text-align:center;font-variant-numeric:tabular-nums}
.who{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:2px 8px;white-space:nowrap}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{display:inline-block;font-size:13px;font-weight:700;text-decoration:none;color:var(--accent);
  border:1px solid var(--accent-soft);background:var(--accent-soft);border-radius:8px;padding:3px 9px;font-variant-numeric:tabular-nums}
.links a:hover{border-color:var(--accent)}
.links a.new{background:var(--accent);color:var(--paper)}
td.sum{color:var(--sub);font-size:14px;min-width:260px}
.empty{padding:28px;text-align:center;color:var(--sub)}
footer{padding:28px 0 48px;color:var(--sub);font-size:13px}
</style>
</head>

<script>
var all=JSON.parse(document.getElementById('data').textContent);
var people={};
all.forEach(function(r){(people[r.name]=people[r.name]||[]).push(r)});
var list=Object.keys(people).map(function(n){
  var rs=people[n].sort(function(a,b){return b.date.localeCompare(a.date)});
  return {name:n,reports:rs,last:rs[0].date,count:rs.length,by:rs[0].by,summary:rs[0].summary};
});
var sortKey='last',asc=false;
function fmt(d){var p=d.split('-');return (+p[1])+'/'+(+p[2])}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var bySel=document.getElementById('by');
Array.from(new Set(all.map(function(r){return r.by}))).forEach(function(b){
  var o=document.createElement('option');o.value=b;o.textContent=b;bySel.appendChild(o)});
function render(){
  var q=document.getElementById('q').value.trim().toLowerCase(), b=bySel.value;
  var rows=list.filter(function(p){
    if(b && !p.reports.some(function(r){return r.by===b})) return false;
    if(!q) return true;
    return (p.name+' '+p.reports.map(function(r){return r.summary+' '+r.by}).join(' ')).toLowerCase().indexOf(q)>-1;
  }).sort(function(x,y){
    var a=x[sortKey],c=y[sortKey],v=typeof a==='number'?a-c:String(a).localeCompare(String(c),'ko');
    if(v===0) v=x.name.localeCompare(y.name,'ko');
    return asc?v:-v;
  });
  document.getElementById('rows').innerHTML=rows.length?rows.map(function(p){
    return '<tr><td class="name">'+esc(p.name)+'</td><td><span class="who">'+esc(p.by)+'</span></td><td class="num">'+p.count+
      '</td><td>'+esc(p.last)+'</td><td><div class="links">'+p.reports.map(function(r,i){
        return '<a class="'+(i===0?'new':'')+'" href="'+esc(r.url)+'" target="_blank" rel="noopener" title="'+esc(r.by)+'">'+fmt(r.date)+'</a>'}).join('')+
      '</div></td><td class="sum">'+esc(p.summary)+'</td></tr>'}).join('')
    :'<tr><td colspan="6" class="empty">찾는 결과가 없습니다.</td></tr>';
}
document.querySelectorAll('th[data-sort]').forEach(function(th){
  th.addEventListener('click',function(){var k=th.dataset.sort;
    if(sortKey===k) asc=!asc; else {sortKey=k;asc=(k==='name'||k==='by')}
    render()})});
document.getElementById('q').addEventListener('input',render);
bySel.addEventListener('change',render);
document.getElementById('sPeople').textContent=list.length;
document.getElementById('sReports').textContent=all.length;
document.getElementById('sLast').textContent=all.map(function(r){return r.date}).sort().pop().slice(5).replace('-','/');
render();
</script>
</body>
</html>
