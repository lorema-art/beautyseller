  {"name":"권정은","date":"2026-10-15","by":"뿌요 교육실장","url":"../kwon-jeongeun-mtdq/consult-261015/","summary":"질문 위주(원격). 베스트로 올린 도브·일리윤 등 주문은 오나 마진 적음 → 소싱은 마진 1천 원↑, 주문 시 카탈로그·에누리 재확인 후 플러스면 발송(도브 1,430→480원도 발송), 역마진은 취소 말고 배송지연 후 주말·월초·월말 재확인. 창고/본사 의심 주소는 검색, 마진 남으면 사무실 경유. 포인트 마진은 네이버·G마켓 로그인 기준, 리뷰·머니·카드 적립 제외, 멤버십은 구매확정 후 마이쇼핑. 베스트 1페이지 AI 수집은 시간 대비 비효율 → 꼬리물기로 전환(로션 지칭어, 에누리 배송비 포함·단어 줄이기, 제조사·브랜드는 1,000개 기준 끝까지). 일리윤 564ml 대체 발송 OK. 오늘의 할인은 참고만. 발주는 복붙 15분 5건. 도매창고 목록은 카톡 요청. 숙제: 꼬리물기 하루 5개, 질문은 셀수다 질문하기."},
  {"name":"이정민","date":"2026-10-15","by":"메이븐","url":"../lee-jeongmin-mmfz/consult-261015/","summary":"꼬리물기에서 상품이 안 찾아지는 원인 2가지 확인: 제조사·브랜드 볼 때 카테고리 바뀔 때마다 첫 페이지 건너뜀, 위→아래 순서로 진행해 할인 끝난 지점을 봄 → 마지막(최신) 제품부터 꼬리물기, 네베소부터 다시. 시트엔 카테고리·제조사·브랜드만(지칭어는 나중), 소싱 링크 수기 정리 중단. 장부: 배송지연 역마진 별도 탭, 취소 확정 삭제. 카드는 한도 없는 혜택만 마진에(롯데카드 발급). 가격관리 충돌 → 알약·V3·윈도우 실시간 보호 끄고 3일 관찰. 모니터 1개 화면 배치. 목표 월 3천만 원."},
  {"name":"조수미","date":"2026-10-15","by":"뿌요 교육실장","url":"../jo-sumi-xwrf/consult-261015/","summary":"컨디션 저하로 짧게, 현금흐름 고민 해결 위주. 카드값 묶임 원인은 모든 카드 납부일 25일 집중 → 큰 카드 3장 1일·중순·말일, 나머지 사이사이로 오늘 분산(결제 기간 1일~말일 변경도 검토). 정산 앞당기기: 주 1회 배송 중 전체 구매확정 요청(발송 8일 후, 요청 7일 뒤 정산). 부족분 100~200만 원은 부분 할부·한 달 리볼빙 또는 비상금 대출 검토. 월 매출 약 1,500만 → 3,000만 안정까지 가전 계속. G마켓 할인 한도 소진 시 가족 아이디+본인 카드, 아니면 미루기. 꼬리물기 1시간 단위 기록(12일 약 1시간 8개), 주말 가격 관리 매주. 회사 병행 하루 3~4시간 목표로 3개월. 다음 상담 미정."},
  {"name":"정다희","date":"2026-10-15","by":"뿌요 교육실장","url":"../jeong-dahui-bzqe/consult-261015/","summary":"지난 컨설팅 후 하루 5~15개, 약 130개 등록. 쿠쿠 밥솥 파손 클레임 → 지금 사진으로 G마켓 쿠쿠에 반품 요청·문의(반품 1~3주, 고객 말에 흔들리지 않기). 재고 없는 남성 BB크림은 내리기. 꼬리물기 중 CNF로 넘어가 꼬임 → 물던 것 끝까지, 등록은 메인+1개짜리만. 가격관리 23:30 끄고 아침 재부팅, 주말 점검 매주. 가전: 네이버 플러스 쇼핑 슈퍼적립, 포인트 포함 마진으로 하루 1시간. 1+1 묶음은 썸네일·‘기획’ 확인, 발송 전 취소는 반품 없이 재판매. 메디힐 팩 사입은 소량·쿠폰 한도 내. 숙제: 1주일간 30분 단위 본 개수/찾은 개수 전량 기록 → 카톡."},
  {"name":"윤기철","date":"2026-10-15","by":"뿌요 교육실장","url":"../yun-gicheol-qnuf/consult-261015/","summary":"질문 해소 위주(원격). 꼬리물기는 순서대로 잘하는 중(톤업크림→PF네이처·은율→레티놀→아이크림→한국콜마, 다음 AHC). 등록은 파란 테두리 메인 카탈로그 기준(1개면 2개짜리 X), 공식몰 깔린 브랜드(네이처카인드)도 마진 남으면 일단 등록. 리뷰 10건↑, 최신순 날짜로 판매 주기 확인(4개월 공백이면 X). 주요정보·태그 생략. 송장 후 재고 없음(미팩토리 코팩)은 반품 완료로 환불, 실제 반품은 공급처 환불 후. 반품비 미입금 무응답은 반품 거부(사유 상세). 강성 고객은 동의 후 직접 취소(사유 배송 지연·서비스 불만족), 3개월 지연은 도래 시 취소. 가격 관리 금~일, 4주 마진 없으면 판매 중지. 저녁 4시간 평균 12개 → 숙제 하루 15개, 다음 주 신청."},
  {"name":"박성길","date":"2026-10-15","by":"뿌요 교육실장","url":"../park-seonggil-azjy/consult-261015/","summary":"숙제 이상 등록 중(9~13개, 최대 18개). CS 정리: 배송 완료 미수령 고객엔 주소 확인 후 현관 사진 톡톡 발송, 취소·환불 끝난 문의는 답 X, 고객 문의·Q&A 하루 1번. 테팔 오주문 반송 건은 반품 접수 불가 → 테팔 톡톡에 대리점 계류 설명하고 환불 요청. 꼬리물기 키워드 두 단어(500ml 삭제), 용닥터 → 스칼프/진정 토닉. 마진 1천 원↑, 택배비·멤버십 포인트 반영, 보라색 최저가 바로 클릭. 에누리는 상품명 줄여 카탈로그 찾기, 리필 묶인 카탈로그 판매 X. 역마진 상관없이 전부 꼬리물기, 겨울 크림·탈모 샴푸. 배송 지연 3개월 건·카탈로그 빠진 전자제품(219849)은 금~일 가격 관리 때. 대량등록 옵션(다운 자켓) 안내 예정. 숙제 하루 10개(다음 20개), 다음 10/20(화) 15시."},
  {"name":"윤재령","date":"2026-10-15","by":"뿌요 교육실장","url":"../yun-jaeryeong-dcgd/consult-261015/","summary":"10/13 원격에 이은 대면 소싱 컨설팅. 네배소 5시간에도 상품이 안 나온 원인은 '사입 3,000원 넣고 1,000원 남는 것만' 찾는 좁은 기준 → 사입·위탁 무관 마진 1,000원 이상+공식 판매처면 등록으로 정정. 바디로션 베스트 실습(1분 내외, 배송비 포함·파란 최저가·카드할인, 해외직구 제외). 헤드앤숄더 선구매 20개는 1개 카탈로그 1위-10원 유지, 2개 묶음은 역마진. 카탈로그 담기·API/IP 점검, 1:1 모드 중복 정리. 목표 주 100개×4주, 전자제품 주 1~2회 10개 내외 섞기(3주차 엘리베이션). 숙제: 꼬리물기 5개 이상 등록."},
  {"name":"최연희","date":"2026-10-15","by":"뿌요 교육실장","url":"../choi-yeonhui-navn/consult-261015/","summary":"10/13 미룬 소싱 컨설팅. 스토어는 10/14 메일 후 10/15 정지 해제(소명은 다시 해야 할 수 있음). 1개를 2개 구성으로 올린 4배수 상품은 비권장(2→1만 OK), 썸 블라썸도 베스트에 안 보임. 바디클렌저 베스트 1페이지 함께 실습: 네이버 수량별 최저가 → 에누리 배송비 포함 → 뒤 단어 2개 지우기 → 파란 글자·카드할인, 옵션·해외직구 주의 — 전부 패스. 마진은 개당가에서 배송비 3,000원 빼고(개당 4,000원은 돼야). 오늘의 할인은 실마진·공식 판매처 직접 확인. 숙제: 베스트 1개 + 꼬리물기 1개, 필요 시 다음 주 재신청."},
  {"name":"전희수","date":"2026-10-15","by":"뿌요 교육실장","url":"../jeon-heesu-ioqo/consult-261015/","summary":"쌓인 질문 해소 위주. 쿠팡 위탁 발송 금지(리셀 금지·박스 로고). 건기식 지칭 단어는 단위 빼고 한글로(원데이 멀티팩, 슈퍼 오메가, 루테인 카테고리 차용). 꼬리물기는 끝난 곳에서 이어서, 브랜드까지 후 최근 상품으로. 주말 카탈로그 가격 관리 안 하고 있었음 → 1천 원↑만 10원 인하/1만 원 인상. 선크림 재고는 역마진 1천 원 이하면 1위 잡고 정리. 닥터파이토 오배송: 쿠팡 반품 후 SK스토아 공식판매처 재발송. 숙제: 하루 7개. 다음 10/21(수) 14시."},
  {"name":"류민경","date":"2026-10-15","by":"뿌요 교육실장","url":"../ryu-mingyeong-rasm/consult-261015/","summary":"4배소는 감 잡음, 헷갈리던 꼬리물기 실습. 지칭 단어는 핵심 단어(솝) 두 단어, 캐스틸 솝으로 아토99 찾아 1개 카탈로그 등록. 마진 1천 원↑만, 오늘의 할인 중단. 가격 관리 프로그램 IP 오류 해결, 1천 원 넘는 상품은 금요일에 에누리 확인 후 10원 인하 또는 1만 원 인상. 숙제: 하루 3~5개 등록, 다음 주 컨설팅."},
  {"name":"임충엽","date":"2026-10-15","by":"뿌요 교육실장","url":"../lim-chungyeop-esau/consult-261015/","summary":"숙제 이상으로 소싱 7개 찾아옴, 진행 순서 잘 지키는 중. 공식 판매처 3기준(공식 판매처 표기·제조사/브랜드 동일·홈쇼핑 6곳 공식) — 홈쇼핑 안 입점사(패션플러스 등)는 상세 확인, 롯데온 자체는 공식 아님, 설화수 제외. 가장 잘 팔리는 카탈로그 기준 마진 1천 원↑만 등록(다른 묶음은 매입용). 에누리 빠뜨림 → 둘 다 확인. 세럼/앰플 등 합친 카테고리는 따로 검색. 숙제: 베스트 중단, 꼬리물기로 하루 5개 등록. 애매하면 셀수다 질문하기."},
  {"name": "박태경", "date": "2026-10-14", "by": "메이븐", "url": "../park-taegyeong-uwth/consult-261014/", "summary": "역방향 소싱으로 수월해짐, 주문 알람 OFF로 집중↑, 역마진은 다른 기수 대비 적음. 1등 뺏어먹기에서 비메인 용량(520·550)·묶음 등록 → 상품 수만 늘고 판매 안 됨 → 메인 SKU+1개짜리만으로 정리. 본 키워드 파란색·3개월 룰(UCL). 지마켓·옥션 쿠쿠 밥솥 수량 제한 → 가전은 하루 1개(1등 뺏어먹기 방식, 리뷰 5건↑, 가전은 QnA 확인). 뺏어먹기 충분히 잡힘 → 선사입·라이브 양방향: 지그재그·네이버 뷰티페스타 쿠폰 한도만큼 소량, 오늘 후보 하나씩 검증 후 전달. 마스크팩 재고는 4주~최대 50일 가격 복원 대기. 브랜드사(염색 샴푸) QnA 도배 → 협의/재등록/카탈로그 해제, 재고 2개씩 코치 매입 예정. 재고 상품 오늘 출발 전부(평일 13시 설정). JHR 1060FD 5개 재주문 건은 테스트 발송, 안 되면 무리 X. 업체 컨택 계속(아컴도 무응답), 의료기기(에스테라 MD) 보류."},
  {"name":"정은아","date":"2026-10-14","by":"메이븐","url":"../jeong-euna-kqvt/consult-261014/","summary":"자동소싱 확장 프로그램 설치 완료. 생활화학제품 신고번호는 '제'·'호' 빼고 숫자만 → 등록 성공, 이미 등록된 1~3번 삭제. 가격관리 프로그램 꺼져 있었음(컴퓨터 켤 때마다 실행, 크롬 창 확인). 공식 판매처 기준 역마진이면 등록 안 함. 꼬리물기: 본 키워드 빨간색(못 찾아도), 3개월 내 중복 파란색, 다음은 맨 아래 '잡티 선크림'부터, 메인 키워드는 카테고리에서. 중국 판매자(양칭 무역) 가품 삭제, 판매자 정보는 맨 아래. 트렌드 상품은 시트 없이 바로 등록. 일정 불규칙 → 하루 1시간 가격관리 고정(1천 원↑ 차이, 마진 없으면 +1만 원, 5만 원 넘으면 중단, 엑셀 대조 중단). 질문은 셀수다 질문하기, 시트 백업함. 추후 선사입 안내."},
  {"name":"전태희","date":"2026-10-14","by":"메이븐","url":"../jeon-taehui-wbtz/consult-261014/","summary":"9월 가전으로 매출 약 2,800만 원(포인트 수익 비중 큼, 10월부터 포인트 별도 관리), 이후 하락세·방문수 감소·역마진 비율 높음 → 가전보다 상품 밀어 넣기, 주말 가격관리 최우선. 허리 때문에 하루 1.5시간. 1등 뺏어먹기 10/1 재개: 아이오페·아모레퍼시픽 파란색, 아모레퍼시픽은 5~10개↑ 나와야 → 재확인, 카테고리는 마지막만, 다음은 최신 순서. 기준 완화: 리셀 리뷰 5건↑ OK, 중국 판매자 금지, 설화수·랑콤·에스티로더 본사만. 지마켓 추가(일반상품 위까지), 1시간 5개 목표, 큰 마진계산기. 1시간 뺏어먹기+30분 가전(누워서 가능하면 1.5시간 전부). 선사입: 주 25건·총 50건↑ 또는 리뷰 3,000건↑, 하루~이틀분, 쿠폰 한도만큼(10%·최대 1만→10만 원). 주 1회 꼬리물기 카톡 검토, 이번 주말 하루 찾은 개수 보고."},
  {"name":"황지영","date":"2026-10-14","by":"메이븐","url":"../hwang-jiyeong-ltrf/consult-261014/","summary":"매출은 오르지만 가전까지 올리는데도 정체 → 꼬리물기를 위→아래로 처리해 할인 타이밍(주 단위)을 놓치고 키워드 기록이 비어 있었음. 최근 찾은 것(맨 아래)부터, 키워드·4배수 진행 위치 기록, 파란색 중복·3개월 룰. 프로그램 구버전 → 신규 설치·로그인(카탈로그 담기, 링크 정리 불필요). 가격관리 매주 금 13~18시. 가전 슈퍼적립은 역마진 사례로 하루 1시간만, 다음 주 파일 재점검 후 꼬리물기 전환. 3개 묶음 제외. 하한가 해제(무재고 금지, 평균가 모르면 털기) → 별도 지정. 지그재그·네이버 뷰티페스타 선사입 팁."},
  {"name":"유숙영","date":"2026-10-14","by":"메이븐","url":"../yu-sukyeong-vaja/consult-261014/","summary":"본사 법무팀 명의 메일에 회신함 → 앞으로 상품 중단 처리만·회신 금지(인정 꼴), 법무법인 아니라 다행, 먼저 코치 문의. 주말 첫 가격관리(1,000원↑ 역마진). 역마진은 초반 잘못된 방식 약 100개·예제 상품·트렌드 지난 제품 탓, 현재 방식은 잡힘(한국콜마→미스트). 현대카드 할인은 별도. 주 50개 남짓·하루 최대 14개(4시간) → 1시간 5개 목표, 한 달 뒤 수익 점검. 기준 완화: 리뷰 5건↑ 리셀러 OK, 중국계·인터내셔널·유한회사 제외, 설화수·에스티로더·랑콤 본사만. 슈퍼적립 가전 실습(가격비교 기준 포인트, 최저가-10원, 새 탭 열기, 세부 카테고리 요일 순환, 로보락 예시 역마진). 꼬리물기:가전 8:2, 30분 블록→45분·1시간 확장. 1~2주 뒤 선사입 안내."},
  {"name":"공미선","date":"2026-10-13","by":"메이븐","url":"../gong-miseon-mkct/consult-261013/","summary":"코치 휴가로 대표가 원격 상담(65분). 저사양 PC로 원격 자주 끊김 → 종료 후 재부팅, 검색 1건 2분 가정. 대량등록 중 PC 꺼져 샴푸 4개 중 2개만 등록 추정 → 스토어 확인 후 사진 공유. 광고대행사 전화(월 20만 원)는 사기, 응대 금지·070 번호 변경. 시트: 같은 상품 3회 중복 소싱, 에누리 카탈로그 기재 → 네이버 카탈로그명·모두 4배소 표기, 찾으면 자동등록에 바로 담기, 구매 링크 저장 금지. 누아레모 OK, 안달로그·바디워시 2건 삭제. 색 규칙(빨강·취소선·파랑) 누락. 염색 샴푸 실습: 단일상품/카탈로그 구분, 묶음 쪼개기 배송비로 불가, 3개 28,800원 허위 구성·47,600÷3 마진 미달 패스. 하루 1시간은 적음, 2주차 강의 따라 하기, 쿠팡 무광고 경험 대비 꼬리물기 집중(선사입 옵션). 다음 주 컨설팅."},
  {"name":"이효인","date":"2026-10-13","by":"메이븐","url":"../lee-hyoin-mnff/consult-261013/","summary":"숙제 완료·소싱 속도는 잡힘. 꼬리물기 시트에 키워드 미기재 + 위→아래 순서 진행 → 원인 추적 불가·할인 종료 상품 위주. 구분선 긋고 새로 기록: 꼬리물기만, 4방향 키워드 필수, 4방향 끝낸 뒤 최근 찾은 제품에서 이어가기, 같은 키워드 3개월 1회. 상품 324건(판매중 268)·미매칭 100건+ 대비 매출 적음 → 3주차대로 대량 매칭 신청, +/− 동시 표기 가격 수동 수정, 주말 가격관리 지속. 방치 역마진 주문은 3개월 배송 마감일에 일괄 취소(금액 무관). 평일 하루 20개(최소 10개, 슈퍼적립 활용). 공식 컨설팅 마지막 → 1~2주마다 셀수다에 시트 링크로 첨삭, 추가 컨설팅은 본인 고민."},
  {"name":"장유환","date":"2026-10-13","by":"메이븐","url":"../jang-yuhwan-etxi/consult-261013/","summary":"6월 강의 후 석 달 공백, 추석특강으로 재시작. 집 PC 셀수다 접속 막힘(앱 ID·시크릿 창) → 자택 IP 미등록 확인·등록, 불명 IP 1개는 사무실에서 삭제. 코치가 자동등록(크롬 필수) 설치, 가격관리 가입·API 키·로그인 유지 세팅(상품 등록 후 상시 실행). 스토어 명의(가족)·강의 명의 불일치는 문제없음. 6월 테스트 등록 후 총판 전화에 겁먹고 중단 → 전화 미응답, 공기계 번호 그대로. 숙제: 2주차·추석특강 복습, 10/16(금)까지 하루 1~3시간 소싱, 주말 코치 컨설팅 신청(빈 시간 없으면 카톡으로 가능 시간 여러 개)."},
  {"name":"최연희","date":"2026-10-13","by":"메이븐","url":"../choi-yeonhui-navn/consult-261013/","summary":"소싱 대신 네이버 소명 해결 우선. 할인 세타필 5건을 역마진(약 5만 원)으로 발송 → 실제 손해 증빙 필요, 판매장부 미작성. 구매처 추적: 롯데온(공식 확인), G마켓 1건은 네이버 가입 계정에서 비공식 구매(가품 판단) — 소명에서 제외 불가. 카드사 앱 결제내역으로 역추적. 코치가 소명서 작성·10/13 제출, 회신 오면 공유. 상품 등록 화면은 열림(정지 해제 가능성), 대량등록 오류 별도 확인. 원칙: 마이너스 발송 금지·공식에서만 구매·메일 확인. 숙제: 4배수 1개 찾기, 10/15(목) 18시 소싱 컨설팅(교육실장)."},
  {"name":"윤재령","date":"2026-10-13","by":"메이븐","url":"../yun-jaeryeong-dcgd/consult-261013/","summary":"교육실장 휴가로 코치 원격 상담. 처음 해 보는 사입 건 처리: 주문 엑셀 받고 발주 확인 먼저, 사입은 주문 즉시 재고관리 입고 등록(G마켓 20개·개당 15,450원, 처음엔 소량 권장) 후 배송 요청 엑셀 업로드. 470ml 상품에 300ml 사진·고시 누락 → GPT·스마트에디터 ONE·리뷰 사진으로 수정. 정품 인증 메일은 소명 필요, 코치가 10/14까지 작성. 10/10 사입 물건 창고 확인 요청. 소싱 막힘으로 10/15(목) 16시 대면 컨설팅(교육실장)."},
  {"name":"이미정","date":"2026-10-13","by":"메이븐","url":"../lee-mijeong-hubv/consult-261013/","summary":"새로 설치한 가격관리·대량등록 프로그램 원격 재세팅. 가격관리는 크롬 창 스마트스토어 로그인 후 창 유지, 밤에 노트북 덮지 않기·아침 재부팅. 예전 꼬리물기 기록을 못 찾아 처음부터: 네이버·에누리 3분의 2 배치, 배송비 포함·파란 최저가·카드할인, 싸도 본사(공식·브랜드=스토어명) 아니면 패스. 숙제: 2주차 강의 따라 하기, 베스트 1개 찾아 꼬리물기, 대량등록 확인."},
  {"name":"이수영","date":"2026-10-13","by":"메이븐","url":"../lee-suyeong-ppoi/consult-261013/","summary":"강의를 거의 못 본 상태의 첫 대면 실습. 스킨케어 베스트로 소싱 전 과정 시연: 판매 구성은 메인+1개만, 네이버(10ml당)·에누리(배송비 포함·파란 최저가·카드할인) 비교, 사입은 +3,000원, 수수료 빼고 최소 1,000원·최저가 -10원, 싼 것 먼저 → 본사 3기준. 본 상품 전부 패스. 자동등록(카탈로그 담기→자리 비울 때 대량 등록) 안내. 숙제: 인베이더스쿨 2주차 강의, 실습 2~3시간, 꼬리물기 시트 공유 후 대면 컨설팅."},
  {"name":"최수현","date":"2026-10-13","by":"메이븐","url":"../choi-suhyeon-dwfl/consult-261013/","summary":"매일 같은 시간을 써도 꼬리물기에서 상품이 안 나오는 상황. 방법은 대체로 맞지만 시트 날짜 차이와 건너뛴 구간 의심. 최근 찾은 것부터 아래→위, 리셀러 기준(중국·하이엔드 제외), 1만 원 이하·무거운 액체류 패스, 등록 정보는 카탈로그 제품 정보 기준. 시간 배분 꼬리물기 5시간+가전(G마켓 베스트) 1시간, 3일 뒤 스토어 추이 점검. 이틀간 매일 업무 끝 카톡·첨삭."},
  {"name":"김재명","date":"2026-10-12","by":"메이븐","url":"../kim-jaemyeong-yqaj/consult-261012/","summary":"할인 없는·카탈로그 아닌 상품과 대량 구매 접근으로 역마진. 강사가 닥터포헤어 샴푸로 시작점 찍어 꼬리물기 재시작: 지칭 단어(브랜드 제외·고유명사 취소선), 제조사·브랜드는 1,000개 넘는 세부 카테고리까지. 에누리 실습(고객 배송비 3,000원 포함 계산), 가격 관리 프로그램 크롬 로그인 해결. 10/15(목) 카톡 중간 점검, 10/17(토) 19시 코치 컨설팅."},
  {"name":"이영선","date":"2026-10-12","by":"메이븐","url":"../lee-yeongseon-eren/consult-261012/","summary":"지난주 잡은 뒤 2·3개 묶음까지 등록하며 기준이 흔들림. 등록은 메인 구성+1개만, 매입은 공식·홈쇼핑·판매자명=브랜드명만 재정립. 꼬리물기는 본 상품 기준·띄어쓰기, 세라마이드 샴푸 실습(전부 패스). 강사 확인: 9/30 반품 오수거(더마브릭), 현금영수증. 주말 문자, 1주 뒤 재점검."},
  {"name":"한미옥","date":"2026-10-12","by":"메이븐","url":"../han-miok-agab/consult-261012/","summary":"설치 후 혼자 등록 단계에서 멈춘 상태. 커머스 API 연동 완료, 자동등록(카탈로그 담기→자기 전 대량 등록) 안내, 화면 배치·메인 키워드 검색·본사 기준 3가지 정리, 닥터 브로너스 슈퍼적립으로 마진 확인. 원격 클릭 불가로 10/20(화) 13시 방문 2시간. 숙제: 4배수홀 1페이지 80개, 구글 시트 공유."},
  {"name":"류민경","date":"2026-10-12","by":"메이븐","url":"../ryu-mingyeong-rasm/consult-261012/","summary":"소싱이 멈춘 원인을 에누리 카탈로그 검색·판매가/매입가 기준 혼선으로 진단, 함께 30분에 4개 발견. 3일간 4배소(1페이지 80개)만 집중 후 꼬리물기, 상품당 30초~1분 타이머. 가격 관리 프로그램 세팅 완료, 역마진·주말 관리 정리. 10/15(목) 13시 교육실장 점검."},

<script>
var all=JSON.parse(document.getElementById('data').textContent);
var people={};
all.forEach(function(r){(people[r.name]=people[r.name]||[]).push(r)});
var list=Object.keys(people).map(function(n){
  var rs=people[n].sort(function(a,b){return b.date.localeCompare(a.date)});
  return {name:n,reports:rs,last:rs[0].date,count:rs.length,by:rs[0].by,summary:rs[0].summary};
});
var sortKey='last',asc=false;
function fmt(d){var p=d.split('-');return (+p[1])+'/'+(+p[2])}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var bySel=document.getElementById('by');
Array.from(new Set(all.map(function(r){return r.by}))).forEach(function(b){
  var o=document.createElement('option');o.value=b;o.textContent=b;bySel.appendChild(o)});
function render(){
  var q=document.getElementById('q').value.trim().toLowerCase(), b=bySel.value;
  var rows=list.filter(function(p){
    if(b && !p.reports.some(function(r){return r.by===b})) return false;
    if(!q) return true;
    return (p.name+' '+p.reports.map(function(r){return r.summary+' '+r.by}).join(' ')).toLowerCase().indexOf(q)>-1;
  }).sort(function(x,y){
    var a=x[sortKey],c=y[sortKey],v=typeof a==='number'?a-c:String(a).localeCompare(String(c),'ko');
    if(v===0) v=x.name.localeCompare(y.name,'ko');
    return asc?v:-v;
  });
  document.getElementById('rows').innerHTML=rows.length?rows.map(function(p){
    return '<tr><td class="name">'+esc(p.name)+'</td><td><span class="who">'+esc(p.by)+'</span></td><td class="num">'+p.count+
      '</td><td>'+esc(p.last)+'</td><td><div class="links">'+p.reports.map(function(r,i){
        return '<a class="'+(i===0?'new':'')+'" href="'+esc(r.url)+'" target="_blank" rel="noopener" title="'+esc(r.by)+'">'+fmt(r.date)+'</a>'}).join('')+
      '</div></td><td class="sum">'+esc(p.summary)+'</td></tr>'}).join('')
    :'<tr><td colspan="6" class="empty">찾는 결과가 없습니다.</td></tr>';
}
document.querySelectorAll('th[data-sort]').forEach(function(th){
  th.addEventListener('click',function(){var k=th.dataset.sort;
    if(sortKey===k) asc=!asc; else {sortKey=k;asc=(k==='name'||k==='by')}
    render()})});
document.getElementById('q').addEventListener('input',render);
bySel.addEventListener('change',render);
document.getElementById('sPeople').textContent=list.length;
document.getElementById('sReports').textContent=all.length;
document.getElementById('sLast').textContent=all.map(function(r){return r.date}).sort().pop().slice(5).replace('-','/');
render();
</script>
