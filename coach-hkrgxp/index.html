*{box-sizing:border-box}

td.sum{color:var(--sub);font-size:14px;min-width:260px}

footer{padding:28px 0 48px;color:var(--sub);font-size:13px}

  {"name": "홍준빈", "date": "2026-10-21", "by": "뷰셀", "url": "../hong-junbin-kqvl/consult-261021/", "summary": "원격 46분. 월 매출 약 5,500만 원(엘리베이션 효과), 매주 100개 등록. 가전 역마진(냉장고·전자레인지) → 판매처는 리뷰 3개+·배송 문의 없는 곳, 구매수 많고 문의 없으면 OK. 총판·대리점(LG) 인상 요청은 따르기, 모니터·꽉 잡힌 냉장고 제외, 가전 신규 등록 중단(매출 빠지면 하루 2~3개 펌핑), 대형 가전 주문은 유동적으로. 가격관리 매주 필수: 최저가 인하 or 페이지 단위 +1만 원, 금요일 오전 발주·오후 가격관리, 5주(5만 원) 판매 중단. 선사입 병행: 메인 배너·편성표 알림, PC 소싱→앱 구매(네이버·에누리 경유 시 할인 오류), 화장품·육아·소형 가전·비냉장 건기식(교육 이수), 카탈로그 리뷰 3,000+ 또는 타 판매자 판매량 합만큼, 적립 한도만큼(평균 10만 원). 꼬리물기 3h·선사입 2h·라이브 틈틈이. 카드 한도 축소는 종소세·부가세 미신고 탓 → 즉시 결제 200만 원씩 분할. 마진 1,000원 이하도 유지, 일 50~60건 넘으면 500원 이하 기준. 옵션 구성 주 2~3개 팔리는 상품, 1~2주 무반응 시 디벨롭. 발주 60건 2~2.5h, 주문 폭증 대비 프로세스 체화. 마진 10%는 초반 6개월, 선사입·옵션이면 20%+. 물류: 주문 즉시 입고 내역 등록, 사서함 번호(동명 유사 4명)."},

  {"name":"최희정","date":"2026-10-19","by":"뿌요 교육실장","url":"../choi-heejeong-mpwq/consult-261019/","summary":"2기. 사무실 대면 48분. 지난 숙제(베스트 1개) 못 함 — 녹화가 카탈로그 장면까지만 있어 막힘 → 녹화하며 다시 한 바퀴. Ctrl+클릭 새 탭·네이버 쪽 탭만 끄기·Ctrl+Shift+T. 에누리 배송비 포함·파란 최저가·카드할인, 묶음가÷수량+3,000원 암산으로 역마진 패스. 공식 판매처 3기준, 싸면 해외직구 의심(라로슈포제·피지오겔 패스), 단지형≠스포이드형, 낱개 박스 없는 6개입 소분 불가. 바이오더마: 기본·슈퍼 적립만 빼 실구매가 약 24,550원, 판매가 최저가-10원 → 마진 700원이라 패스(1,000원 기준). 셀수다 로그인 정리·확장 고정. 숙제: 2주차 강의 재시청, 베스트→꼬리물기 1개 이상."},
  {"name":"김미진","date":"2026-10-18","by":"뿌요 교육실장","url":"../kim-mijin-elyp/consult-261018/","summary":"원격 35분, 첫 리포트. 본업 병행으로 소싱 정체, 목표 100개 등록. 바탕화면 꼬리물기 파일 261018로 일원화. 휴대폰 특가 알림으로 올린 마스크·AHC 리얼 아이크림·바디워시는 시트에 '특가' 표시(사무실 재고 판매 전), 꼬리물기는 레티놀 세럼 줄부터. 카탈로그 가격관리 미실시 → 에누리 최저가 -10원, 안 맞으면 +1만 원 물갈이, 단 등록 우선. 한 브랜드만 뜨는 키워드 파란색 패스, 리뷰 10개 이하 패스, 에누리 배송비 포함·카탈로그 없으면 뒤를 지워 3~4단어, 세트·GS샵 TV 상품·카드할인 없는 건 패스. 이지듀: 셀러허브(대형 리셀러, 판매자 정보·리뷰·한국인 확인) 구매 허용, 마진 약 7,000원 위탁. 반품은 물류 담당자. 원격 5분마다 끊김. 숙제: 매일 또는 3일에 한 번 등록, 10/28(수)까지 안 나오면 베스트부터 새로."},
  {"name":"조예진","date":"2026-10-18","by":"뿌요 교육실장","url":"../jo-yejin-mrdx/consult-261018/","summary":"원격 33분(하루 2~3시간). 셀수다 오늘의 할인으로만 등록 중, 꼬리물기 시트 미시작. 오늘의 할인은 단타 → 주력은 베스트·꼬리물기. 역마진은 금·토·일 카탈로그 가격관리에서 1,000원 이상만 점검(가능하면 최저가-10원, 안 되면 +1만원, 1,000원 미만은 프로그램). 엣지→크롬 권장, Ctrl+Shift+T. 베스트 실습(크림, 해외직구 제외·80개): 에스트라·시즌7·비공식몰·라로슈포제 오매핑/해외직구·피지오겔 등 모두 패스, 판매가-배송비 3,000원 암산법. 꼬리물기 4방향 안내. 전자제품은 매출용으로 소량 가능, PC 모니터 금지. 숙제: 2주차 강의 따라 하기, 꼬리물기 5개."},
  {"name":"김수정","date":"2026-10-18","by":"뿌요 교육실장","url":"../kim-sujeong-rysp/consult-261018/","summary":"원격 38분, 첫 상담(리셀 경험 있음, 하루 종일 가능). 자금 부담으로 사입 대신 위탁 가능 여부 → 위탁 OK(화장품은 위탁 비중↑, 사입 섞어도 됨), 화장품+식품 병행 가능. 가품 소명 약 3일·정산 일주일 내 해제, 위수탁 정지 시 사업자 추가로 마켓 재개설(최대 3개). 베스트 세팅(80개·19 제외·1페이지) 정상, 꼬리물기 단어 2단어로. 실습: 카탈로그 없으면 패스, 파란 최저가/더보기, 수량 맞춰 비교. 본사 외 판매자 판별(한국 판매자+리뷰 OK, 유한회사 제외) 기준 완화 안내. 자동 소싱은 보조·시트 별도 탭. 카드 결제일 분산, 네이버 집중. 숙제: 하루 최소 10개 소싱, 매주 컨설팅 신청."},
  {"name":"오하경","date":"2026-10-18","by":"뿌요 교육실장","url":"../oh-hagyeong-kxtp/consult-261018/","summary":"원격 29분(연결 여러 번 끊김). 지난주 0개 → 강의 재시청으로 방법 교정, 하루 4~5개 진행 중. 공식몰 외 구매 기준(한국인 판매자·리뷰·판매자 등급, 중국 업체·해외직구 제외). 꼬리물기 시트: 키워드 칸은 검색한 두 단어·띄어쓰기 유지, 3개 제한 없음, 미라클 에멀젼 추가. 한 줄을 브랜드까지 끝낸 뒤 꼬리물기, 매일 최근 키워드부터. 핑크 에멀젼 함께 소싱(마몽드 2개 마진 약 1,000원, 1타2피는 마이너스). 포인트는 로그인 상태로 확인. 양식의 베스트 상품 올려 보기, 주문 시 마진 없으면 배송지연+1만원 인상. 화장솜은 화장품 수익 낸 뒤. 목표: 하루 3시간·10개 등록, 다음 주 재신청."},
  {"name":"김은영","date":"2026-10-18","by":"뿌요 교육실장","url":"../kim-eunyeong-zbal/consult-261018/","summary":"대면 74분, 첫 상담(컴퓨터 익숙지 않음, 하루 1~2시간). 강의 반복 시청에도 등록·주문 이후 흐름을 몰라 상품 0개 → 프로그램 4개 점검(IP 추가, 사서함 최신 버전 업데이트, 드래그 확장 설치, 가격관리 가입). 오늘의 할인으로 첫 상품 등록(마진 1,000원↑+공식 판매처, 실패 원인은 IP·전성분). 주문 처리: 신규주문→발주확인(이후 취소는 승인 필요), 3일 내, 역마진은 배송지연, 반사입. 마진 계산기(최저가-10원, 사무실 경유 택배 3,000원). 베스트(가격비교 경로·해외직구 제외·80개·1페이지)·꼬리물기 4방향, 공식 판매처만, 1상품 1분. 가격관리 1 사이클 미시작 → 재확인 예정. 숙제: 베스트 1개+꼬리물기 1개 이상. 클릭 순서 정리·꼬리물기 시트 카톡 전달."},
  {"name":"허진구","date":"2026-10-18","by":"뿌요 교육실장","url":"../heo-jingu-rwpn/consult-261018/","summary":"첫 주문 2건 배송 완료, 정산은 구매확정(또는 배송 완료 8일 후) 기준. 샴푸 블랙 꼬리물기를 함께 보며 마진 부족·비공식몰 후보 정리, 위탁 송장 찾는 법(마이쇼핑 → 주문/배송내역). 남은 줄 소진 후 베스트로 새로 소싱."},
  {"name":"김재명","date":"2026-10-17","by":"뿌요 교육실장","url":"../kim-jaemyeong-yqaj/consult-261017/","summary":"꼬리물기 시트 왼쪽 칸에 판매처를 적던 것 교정(왼쪽 지칭 단어, 판매처는 오른쪽 브랜드 옆). 역마진 바디로션은 29CM 구매처 찾아 판매중 전환·17,760원으로 수정. 서울화장품 소싱 실습(카탈로그 없으면 바로 패스). 직접 전달로 잘못 넘어간 1건 판매자 직접 반품·환불. 숙제: 하루 3개 등록."},
  {"name":"김자영","date":"2026-10-17","by":"뿌요 교육실장","url":"../kim-jayeong-nmwd/consult-261017/","summary":"주문은 늘었지만 발주에 시간을 다 써 소싱이 멈춤. 발주 1건 3분·5건 15분(최대 20분) 기준, 실구매가는 확정 할인만, 운송장 안내·마진 재계산 생략. A/S 개인번호 일괄 변경. 순서: 발주→소싱."},
  {"name":"이현임","date":"2026-10-17","by":"뿌요 교육실장","url":"../lee-hyeonim-baxp/consult-261017/","summary":"원격. 쿠팡 위탁 중단 후 신규 주문 감소 → 가격관리 프로그램을 확장 프로그램에서 찾다 한 번도 못 돌림, 폴더 내 셀수다 가격관리→시작→크롬 로그인으로 진입 성공. 406개 중 앞 2페이지도 대부분 1위 아님 → 금·토·일(목요일 아님) 4페이지까지 에누리 확인 후 최저가 또는 1만 원 인상. 꼬리물기: 오늘의 할인 상품은 출발점 불가, 향 빼고 샴푸 300g까지, 제조사·브랜드는 세부 카테고리별, 다 본 칸 빨간색. 실습: 닥터 라파알 공식 딱지 할인 3개 묶음 마진 약 1,500원. 하루 1개 등록 → 숙제: 매일 5개 소싱. 매트 싱글·더블 옵션 등록법(재고 999 재입력). 컨설팅은 질문 하나+소싱 진도."},
  {"name":"박민경","date":"2026-10-16","by":"뿌요 교육실장","url":"../park-mingyeong-nayr/consult-261016/","summary":"원격 29분. 9월 컨설팅 후 네베소 없이 꼬리물기만 진행 → 방향 맞음, 네베소 갈 일 거의 없음. 안 나오는 구간(핸드크림)은 빠르게 넘기기. 진행 순서: 가로(지칭어→카테고리→브랜드→제조사) 끝낸 뒤 최근 상품부터, 쌓이면 아래로·없으면 위로. 지칭어 두 단어, 상품명 속 지칭어 우선(폼). 중국인·유한회사 판매자 제외, 멤버십 표시 없으면 패스, 카드 적립 제외, 1개 1분 목표. 주말 카탈로그 가격관리: +1,000원 이상만 최저가 -10원 또는 영마진 +1만 원, 4~5만 원 차이 지속 시 판매 중지, 최저가와 같음은 패스. 매입은 에누리만 3분 내. 속도 향상 → 숙제 하루 10개(3시간)."},
  {"name":"유희상","date":"2026-10-16","by":"뿌요 교육실장","url":"../yu-heesang-ibbo/consult-261016/","summary":"원격, 학원 강사(하루 3~4시간). 적립 계산법 몰라 1개짜리 전부 패스 → 톤28 멤버십가 27,070원에서 기본·슈퍼·멤버십 적립 차감(리뷰·머니·전용카드 제외) 실구매 약 23,012원, 위탁 마진 약 4,800원. 지칭어 검증: 플로라 마스크 삭제, 글로우 마스크 사용. 비베스트 출발 마몽드(리필팩) 줄 삭제, 존슨즈 바디로션(베스트)에서 청순 로션부터 꼬리물기. 시트에 키워드·날짜 필수. 등록은 카탈로그 담기→대량등록, 공식홈은 발주용. 숙제: 베스트+꼬리물기 하루 5개, 마진 1천 원↑."},
  {"name":"이은지","date":"2026-10-16","by":"뿌요 교육실장","url":"../lee-eunji-eazq/consult-261016/","summary":"대면. 특가 위주 소싱은 반짝 팔리고 끝남 → 베스트+꼬리물기로 복귀(계림당 샴푸 시작, 요즘 바디워시·크림). 발주를 실시간으로 하루 종일 붙잡는 습관 → 정한 시간에 에누리·G마켓만, 15분 5건, 없으면 바로 배송지연, 못 끝내면 소싱 먼저. CS는 밤 10~11시 몰아서, 전화 받지 않기. 택배 건은 대표님 번호, 대형 설치 가전만 고객 번호. 쿠팡 리셀 금지 → 집·사무실 주소만, 택배비 3,000~5,000원. 건기식 신고 완료 → 건강기능식품 베스트 2시간 내. 가격관리 금~일, 1시간 50개, 역마진 매주 1만 원. 셀수다 사서함 안 보임 → 최신 버전 재설치. 체험단 재고는 카탈로그 있는 것만. 숙제: 1시간 10개, 30개."},
  {"name":"김지영","date":"2026-10-16","by":"뿌요 교육실장","url":"../kim-jiyeong-tqhr/consult-261016/","summary":"원격(컴퓨터 익숙지 않음). 셀수다 자동등록 가운데 불이 1주일 꺼져 상품 0개 → 원격 접속 시엔 정상, 원인 미확인. 재발 시 네이버 커머스 API ID·Secret 환경설정 재입력, IP 확인. 스킨케어 베스트 시연(해외직구 제외·80개, 수량→개당+3,000원→본사 확인, 에누리 배송비 포함) 후 대표님 직접 1개 실습. 카드 없음 → 카드 할인 제외. 건기식 판매 불가. 오늘의 할인 닥터올가 약 4,000원 마진 → 카탈로그 담기·대량등록 시연, 창 2개로 토리든 테스트 등록됨 → 판매중지 필요. 건당 약 200원, 구글 AI 스튜디오 자동충전 확인. 강의 틀어놓고 따라 하기, 막히면 컨설팅 예약."},
  {"name":"이연정","date":"2026-10-16","by":"뿌요 교육실장","url":"../lee-yeonjeong-brwx/consult-261016/","summary":"원격 화면 공유 38분. 지난주 숙제(하루 10개 등록)는 되는 날도 있고 아쉬운 날도 있었고, 꼬리물기에서 1시간에 1개 정도 나오며 한국콜마는 같은 상품만 반복돼 거의 안 나온 상태. 리프팅 마스크 꼬리물기를 같이 돌리며 에누리 기준을 바로잡음(배송비 포함 체크, 파란색 최저가 중 수량이 맞는 것만 클릭, 자동 묶음 오류는 직접 확인, 카탈로그가 안 뜨면 뒤쪽을 확 지워 세 단어만 남기고 없으면 패스, 메인 카탈로그 수량 먼저 확인). 이미 등록했는지는 네이버 카탈로그나 시트 Ctrl+F '모두 찾기'로 확인. 닥터지 1개짜리는 쿠폰가 약 19,000원 기준 약 1,400원 마진. 새 방법으로 공식몰 멤버십 적립 위탁을 배움: 톤28 약 29,920원에서 기본+멤버십 추가 적립만 빼고(리뷰·페이머니·카드 적립 제외) 위탁 택배비 없이 약 2,000원 마진, 적립금은 인출은 안 되고 다음 구매나 역마진 보전에 사용. 시트는 가장 최근에 찾은 상품부터 하고, 다음 날은 맨 아래부터 위로 진행. 가격관리 프로그램은 로그인이 끊겨 있어 '자세한 기록 보기'에서 '1사이클 시작·진입 성공'을 확인하고, 없으면 중지 → 재시작 → 네이버 로그인으로 복구. 최저가 같음은 그대로 두고, ± 표시는 실제 최저가를 확인해 10원 싸게 맞추거나 역마진이면 1만 원 인상, +1,000원 이상은 주말에 정리. 소싱 속도 30~40초로 느리지 않음, 3개월 바짝 하면 매출 궤도. 숙제: 하루 10개 등록 유지, 되면 20개로 상향. 다음 상담: 다음 주(일시 미정)."},
  {"name":"백지선","date":"2026-10-16","by":"뿌요 교육실장","url":"../baek-jiseon-fgtt/consult-261016/","summary":"원격. 마스크팩·앰플·색조 오가며 소싱 안 나옴 → 2차 카테고리(스킨/토너) 고정, 80개 끝까지, 다음 크림·패드. 속도 30~40초로 양호. 블랑네이처 어성초 토너 300ml: 기본+멤버십 추가 적립만 반영(리뷰·머니·멤버십 카드 적립 제외) 실구매 약 18,445원, 위탁 시 마진 약 1,700원. 오늘의 할인: 마진 1천 원↑+공식 판매처, 쿠팡 매칭 오류 주의, 엘바이오 건기식 5개 묶음→1개 카탈로그 약 2,000원. 시트 구분 네베소/오늘의 할인(구매 링크 기록, 꼬리물기 안 함). 가격은 자동 10원 저가. 꼬리물기 지칭어 두 단어·제조사 1,000개 기준 복습(2주차). 하루 2시간. 숙제: 베스트+꼬리물기 5개."},
  {"name":"최희정","date":"2026-10-16","by":"뿌요 교육실장","url":"../choi-heejeong-mpwq/consult-261016/","summary":"2기. 컴퓨터가 익숙지 않아 대면으로 소싱 한 바퀴 실습: 가격비교·에누리 두 창 분리, 상품명 3단어로 줄여 검색, 배송비 포함 체크, 네베소 세팅(화장품/미용›비건›스킨케어, 해외직구 제외, 80개씩), 확장 프로그램 카탈로그 담기→대량등록, 크롬 원격 코드 생성 확인. 환불 고민하다 자신감 생김. 꼬리물기는 보류. 숙제: 베스트 1개 소싱 후 꼬리물기 시트 기록. 주 2회 방문, 다음 월요일 12시."},
  {"name":"김재호","date":"2026-10-16","by":"뿌요 교육실장","url":"../kim-jaeho-dwwh/consult-261016/","summary":"소싱 하루 5~7개로 순항, 한 상품 하루 3개+ 판매로 매일 사입. 제조사 내림 요청은 판매 중지 후 계속 업로드. 본사 외 한국인 대형 리셀러(JJ몰 등 파워·왕관, 리뷰 10건+) 소싱 허용, 중국인·리뷰 없는 판매자 제외. 기획 세트 구분, 단지형/튜브형 혼용 문구, 멤버십 전용 카드 적립 제외, 구글 시트 중복 거르기. 숙제: 하루 10개 소싱·등록. 꼬리물기 교수님 코칭 검토. 다음 10/21(수) 15시."},
  {"name":"나선영","date":"2026-10-15","by":"뿌요 교육실장","url":"../na-seonyeong-qtvh/consult-261015/","summary":"초반 자동등록 대량 후 정품 소싱처 못 찾아 취소·배송 지연 반복, 사기 저하(4주차까지 수강, 복습은 2주차까지). 크리스마 화장솜 주문은 에누리 판매처 본사 아님+배송비 포함 역마진 → 발송 지연 3개월. 현재 주문 처리 방식(가격비교·에누리 → 본사 확인)은 맞음. 네베소 실습: 메인 카탈로그 기준가, 묶음 개당가+배송비 3,000원 비교, 에누리 배송비 포함·카탈로그 없으면 2~3단어로 줄이기·카드할인 — 알페신 등 전부 패스. 공식 판매처: 공식 딱지·홈쇼핑·브랜드사 표기, 100% 정품 문구·셀러허브·패션플러스는 주의. 홈쇼핑 회원가입. 새 PC에 1주차대로 설치, 가격관리 재실행, 자동등록 업데이트는 노트북 오작동으로 미완. 1천 원↑은 주말 수동(3주차 복습). 매일 30분~1시간. 숙제: 베스트 1개→꼬리물기 3개, 다음 주 컨설팅. 사무실 방문 희망."},
  {"name":"권정은","date":"2026-10-15","by":"뿌요 교육실장","url":"../kwon-jeongeun-mtdq/consult-261015/","summary":"질문 위주(원격). 베스트로 올린 도브·일리윤 등 주문은 오나 마진 적음 → 소싱은 마진 1천 원↑, 주문 시 카탈로그·에누리 재확인 후 플러스면 발송(도브 1,430→480원도 발송), 역마진은 취소 말고 배송지연 후 주말·월초·월말 재확인. 창고/본사 의심 주소는 검색, 마진 남으면 사무실 경유. 포인트 마진은 네이버·G마켓 로그인 기준, 리뷰·머니·카드 적립 제외, 멤버십은 구매확정 후 마이쇼핑. 베스트 1페이지 AI 수집은 시간 대비 비효율 → 꼬리물기로 전환(로션 지칭어, 에누리 배송비 포함·단어 줄이기, 제조사·브랜드는 1,000개 기준 끝까지). 일리윤 564ml 대체 발송 OK. 오늘의 할인은 참고만. 발주는 복붙 15분 5건. 도매창고 목록은 카톡 요청. 숙제: 꼬리물기 하루 5개, 질문은 셀수다 질문하기."},
  {"name":"이정민","date":"2026-10-15","by": "뷰셀","url":"../lee-jeongmin-mmfz/consult-261015/","summary":"꼬리물기에서 상품이 안 찾아지는 원인 2가지 확인: 제조사·브랜드 볼 때 카테고리 바뀔 때마다 첫 페이지 건너뜀, 위→아래 순서로 진행해 할인 끝난 지점을 봄 → 마지막(최신) 제품부터 꼬리물기, 네베소부터 다시. 시트엔 카테고리·제조사·브랜드만(지칭어는 나중), 소싱 링크 수기 정리 중단. 장부: 배송지연 역마진 별도 탭, 취소 확정 삭제. 카드는 한도 없는 혜택만 마진에(롯데카드 발급). 가격관리 충돌 → 알약·V3·윈도우 실시간 보호 끄고 3일 관찰. 모니터 1개 화면 배치. 목표 월 3천만 원."},
  {"name":"조수미","date":"2026-10-15","by":"뿌요 교육실장","url":"../jo-sumi-xwrf/consult-261015/","summary":"컨디션 저하로 짧게, 현금흐름 고민 해결 위주. 카드값 묶임 원인은 모든 카드 납부일 25일 집중 → 큰 카드 3장 1일·중순·말일, 나머지 사이사이로 오늘 분산(결제 기간 1일~말일 변경도 검토). 정산 앞당기기: 주 1회 배송 중 전체 구매확정 요청(발송 8일 후, 요청 7일 뒤 정산). 부족분 100~200만 원은 부분 할부·한 달 리볼빙 또는 비상금 대출 검토. 월 매출 약 1,500만 → 3,000만 안정까지 가전 계속. G마켓 할인 한도 소진 시 가족 아이디+본인 카드, 아니면 미루기. 꼬리물기 1시간 단위 기록(12일 약 1시간 8개), 주말 가격 관리 매주. 회사 병행 하루 3~4시간 목표로 3개월. 다음 상담 미정."},
  {"name":"정다희","date":"2026-10-15","by":"뿌요 교육실장","url":"../jeong-dahui-bzqe/consult-261015/","summary":"지난 컨설팅 후 하루 5~15개, 약 130개 등록. 쿠쿠 밥솥 파손 클레임 → 지금 사진으로 G마켓 쿠쿠에 반품 요청·문의(반품 1~3주, 고객 말에 흔들리지 않기). 재고 없는 남성 BB크림은 내리기. 꼬리물기 중 CNF로 넘어가 꼬임 → 물던 것 끝까지, 등록은 메인+1개짜리만. 가격관리 23:30 끄고 아침 재부팅, 주말 점검 매주. 가전: 네이버 플러스 쇼핑 슈퍼적립, 포인트 포함 마진으로 하루 1시간. 1+1 묶음은 썸네일·‘기획’ 확인, 발송 전 취소는 반품 없이 재판매. 메디힐 팩 사입은 소량·쿠폰 한도 내. 숙제: 1주일간 30분 단위 본 개수/찾은 개수 전량 기록 → 카톡."},
  {"name":"윤기철","date":"2026-10-15","by":"뿌요 교육실장","url":"../yun-gicheol-qnuf/consult-261015/","summary":"질문 해소 위주(원격). 꼬리물기는 순서대로 잘하는 중(톤업크림→PF네이처·은율→레티놀→아이크림→한국콜마, 다음 AHC). 등록은 파란 테두리 메인 카탈로그 기준(1개면 2개짜리 X), 공식몰 깔린 브랜드(네이처카인드)도 마진 남으면 일단 등록. 리뷰 10건↑, 최신순 날짜로 판매 주기 확인(4개월 공백이면 X). 주요정보·태그 생략. 송장 후 재고 없음(미팩토리 코팩)은 반품 완료로 환불, 실제 반품은 공급처 환불 후. 반품비 미입금 무응답은 반품 거부(사유 상세). 강성 고객은 동의 후 직접 취소(사유 배송 지연·서비스 불만족), 3개월 지연은 도래 시 취소. 가격 관리 금~일, 4주 마진 없으면 판매 중지. 저녁 4시간 평균 12개 → 숙제 하루 15개, 다음 주 신청."},
  {"name":"박성길","date":"2026-10-15","by":"뿌요 교육실장","url":"../park-seonggil-azjy/consult-261015/","summary":"숙제 이상 등록 중(9~13개, 최대 18개). CS 정리: 배송 완료 미수령 고객엔 주소 확인 후 현관 사진 톡톡 발송, 취소·환불 끝난 문의는 답 X, 고객 문의·Q&A 하루 1번. 테팔 오주문 반송 건은 반품 접수 불가 → 테팔 톡톡에 대리점 계류 설명하고 환불 요청. 꼬리물기 키워드 두 단어(500ml 삭제), 용닥터 → 스칼프/진정 토닉. 마진 1천 원↑, 택배비·멤버십 포인트 반영, 보라색 최저가 바로 클릭. 에누리는 상품명 줄여 카탈로그 찾기, 리필 묶인 카탈로그 판매 X. 역마진 상관없이 전부 꼬리물기, 겨울 크림·탈모 샴푸. 배송 지연 3개월 건·카탈로그 빠진 전자제품(219849)은 금~일 가격 관리 때. 대량등록 옵션(다운 자켓) 안내 예정. 숙제 하루 10개(다음 20개), 다음 10/20(화) 15시."},
  {"name":"윤재령","date":"2026-10-15","by":"뿌요 교육실장","url":"../yun-jaeryeong-dcgd/consult-261015/","summary":"10/13 원격에 이은 대면 소싱 컨설팅. 네배소 5시간에도 상품이 안 나온 원인은 '사입 3,000원 넣고 1,000원 남는 것만' 찾는 좁은 기준 → 사입·위탁 무관 마진 1,000원 이상+공식 판매처면 등록으로 정정. 바디로션 베스트 실습(1분 내외, 배송비 포함·파란 최저가·카드할인, 해외직구 제외). 헤드앤숄더 선구매 20개는 1개 카탈로그 1위-10원 유지, 2개 묶음은 역마진. 카탈로그 담기·API/IP 점검, 1:1 모드 중복 정리. 목표 주 100개×4주, 전자제품 주 1~2회 10개 내외 섞기(3주차 엘리베이션). 숙제: 꼬리물기 5개 이상 등록."},
  {"name":"최연희","date":"2026-10-15","by":"뿌요 교육실장","url":"../choi-yeonhui-navn/consult-261015/","summary":"10/13 미룬 소싱 컨설팅. 스토어는 10/14 메일 후 10/15 정지 해제(소명은 다시 해야 할 수 있음). 1개를 2개 구성으로 올린 4배수 상품은 비권장(2→1만 OK), 썸 블라썸도 베스트에 안 보임. 바디클렌저 베스트 1페이지 함께 실습: 네이버 수량별 최저가 → 에누리 배송비 포함 → 뒤 단어 2개 지우기 → 파란 글자·카드할인, 옵션·해외직구 주의 — 전부 패스. 마진은 개당가에서 배송비 3,000원 빼고(개당 4,000원은 돼야). 오늘의 할인은 실마진·공식 판매처 직접 확인. 숙제: 베스트 1개 + 꼬리물기 1개, 필요 시 다음 주 재신청."},
  {"name":"전희수","date":"2026-10-15","by":"뿌요 교육실장","url":"../jeon-heesu-ioqo/consult-261015/","summary":"쌓인 질문 해소 위주. 쿠팡 위탁 발송 금지(리셀 금지·박스 로고). 건기식 지칭 단어는 단위 빼고 한글로(원데이 멀티팩, 슈퍼 오메가, 루테인 카테고리 차용). 꼬리물기는 끝난 곳에서 이어서, 브랜드까지 후 최근 상품으로. 주말 카탈로그 가격 관리 안 하고 있었음 → 1천 원↑만 10원 인하/1만 원 인상. 선크림 재고는 역마진 1천 원 이하면 1위 잡고 정리. 닥터파이토 오배송: 쿠팡 반품 후 SK스토아 공식판매처 재발송. 숙제: 하루 7개. 다음 10/21(수) 14시."},
  {"name":"류민경","date":"2026-10-15","by":"뿌요 교육실장","url":"../ryu-mingyeong-rasm/consult-261015/","summary":"4배소는 감 잡음, 헷갈리던 꼬리물기 실습. 지칭 단어는 핵심 단어(솝) 두 단어, 캐스틸 솝으로 아토99 찾아 1개 카탈로그 등록. 마진 1천 원↑만, 오늘의 할인 중단. 가격 관리 프로그램 IP 오류 해결, 1천 원 넘는 상품은 금요일에 에누리 확인 후 10원 인하 또는 1만 원 인상. 숙제: 하루 3~5개 등록, 다음 주 컨설팅."},
  {"name":"임충엽","date":"2026-10-15","by":"뿌요 교육실장","url":"../lim-chungyeop-esau/consult-261015/","summary":"숙제 이상으로 소싱 7개 찾아옴, 진행 순서 잘 지키는 중. 공식 판매처 3기준(공식 판매처 표기·제조사/브랜드 동일·홈쇼핑 6곳 공식) — 홈쇼핑 안 입점사(패션플러스 등)는 상세 확인, 롯데온 자체는 공식 아님, 설화수 제외. 가장 잘 팔리는 카탈로그 기준 마진 1천 원↑만 등록(다른 묶음은 매입용). 에누리 빠뜨림 → 둘 다 확인. 세럼/앰플 등 합친 카테고리는 따로 검색. 숙제: 베스트 중단, 꼬리물기로 하루 5개 등록. 애매하면 셀수다 질문하기."},
  {"name": "박태경", "date": "2026-10-14", "by": "뷰셀", "url": "../park-taegyeong-uwth/consult-261014/", "summary": "역방향 소싱으로 수월해짐, 주문 알람 OFF로 집중↑, 역마진은 다른 기수 대비 적음. 1등 뺏어먹기에서 비메인 용량(520·550)·묶음 등록 → 상품 수만 늘고 판매 안 됨 → 메인 SKU+1개짜리만으로 정리. 본 키워드 파란색·3개월 룰(UCL). 지마켓·옥션 쿠쿠 밥솥 수량 제한 → 가전은 하루 1개(1등 뺏어먹기 방식, 리뷰 5건↑, 가전은 QnA 확인). 뺏어먹기 충분히 잡힘 → 선사입·라이브 양방향: 지그재그·네이버 뷰티페스타 쿠폰 한도만큼 소량, 오늘 후보 하나씩 검증 후 전달. 마스크팩 재고는 4주~최대 50일 가격 복원 대기. 브랜드사(염색 샴푸) QnA 도배 → 협의/재등록/카탈로그 해제, 재고 2개씩 코치 매입 예정. 재고 상품 오늘 출발 전부(평일 13시 설정). JHR 1060FD 5개 재주문 건은 테스트 발송, 안 되면 무리 X. 업체 컨택 계속(아컴도 무응답), 의료기기(에스테라 MD) 보류."},
  {"name":"정은아","date":"2026-10-14","by": "뷰셀","url":"../jeong-euna-kqvt/consult-261014/","summary":"자동소싱 확장 프로그램 설치 완료. 생활화학제품 신고번호는 '제'·'호' 빼고 숫자만 → 등록 성공, 이미 등록된 1~3번 삭제. 가격관리 프로그램 꺼져 있었음(컴퓨터 켤 때마다 실행, 크롬 창 확인). 공식 판매처 기준 역마진이면 등록 안 함. 꼬리물기: 본 키워드 빨간색(못 찾아도), 3개월 내 중복 파란색, 다음은 맨 아래 '잡티 선크림'부터, 메인 키워드는 카테고리에서. 중국 판매자(양칭 무역) 가품 삭제, 판매자 정보는 맨 아래. 트렌드 상품은 시트 없이 바로 등록. 일정 불규칙 → 하루 1시간 가격관리 고정(1천 원↑ 차이, 마진 없으면 +1만 원, 5만 원 넘으면 중단, 엑셀 대조 중단). 질문은 셀수다 질문하기, 시트 백업함. 추후 선사입 안내."},
  {"name":"전태희","date":"2026-10-14","by": "뷰셀","url":"../jeon-taehui-wbtz/consult-261014/","summary":"9월 가전으로 매출 약 2,800만 원(포인트 수익 비중 큼, 10월부터 포인트 별도 관리), 이후 하락세·방문수 감소·역마진 비율 높음 → 가전보다 상품 밀어 넣기, 주말 가격관리 최우선. 허리 때문에 하루 1.5시간. 1등 뺏어먹기 10/1 재개: 아이오페·아모레퍼시픽 파란색, 아모레퍼시픽은 5~10개↑ 나와야 → 재확인, 카테고리는 마지막만, 다음은 최신 순서. 기준 완화: 리셀 리뷰 5건↑ OK, 중국 판매자 금지, 설화수·랑콤·에스티로더 본사만. 지마켓 추가(일반상품 위까지), 1시간 5개 목표, 큰 마진계산기. 1시간 뺏어먹기+30분 가전(누워서 가능하면 1.5시간 전부). 선사입: 주 25건·총 50건↑ 또는 리뷰 3,000건↑, 하루~이틀분, 쿠폰 한도만큼(10%·최대 1만→10만 원). 주 1회 꼬리물기 카톡 검토, 이번 주말 하루 찾은 개수 보고."},
  {"name":"황지영","date":"2026-10-14","by": "뷰셀","url":"../hwang-jiyeong-ltrf/consult-261014/","summary":"매출은 오르지만 가전까지 올리는데도 정체 → 꼬리물기를 위→아래로 처리해 할인 타이밍(주 단위)을 놓치고 키워드 기록이 비어 있었음. 최근 찾은 것(맨 아래)부터, 키워드·4배수 진행 위치 기록, 파란색 중복·3개월 룰. 프로그램 구버전 → 신규 설치·로그인(카탈로그 담기, 링크 정리 불필요). 가격관리 매주 금 13~18시. 가전 슈퍼적립은 역마진 사례로 하루 1시간만, 다음 주 파일 재점검 후 꼬리물기 전환. 3개 묶음 제외. 하한가 해제(무재고 금지, 평균가 모르면 털기) → 별도 지정. 지그재그·네이버 뷰티페스타 선사입 팁."},
  {"name":"유숙영","date":"2026-10-14","by": "뷰셀","url":"../yu-sukyeong-vaja/consult-261014/","summary":"본사 법무팀 명의 메일에 회신함 → 앞으로 상품 중단 처리만·회신 금지(인정 꼴), 법무법인 아니라 다행, 먼저 코치 문의. 주말 첫 가격관리(1,000원↑ 역마진). 역마진은 초반 잘못된 방식 약 100개·예제 상품·트렌드 지난 제품 탓, 현재 방식은 잡힘(한국콜마→미스트). 현대카드 할인은 별도. 주 50개 남짓·하루 최대 14개(4시간) → 1시간 5개 목표, 한 달 뒤 수익 점검. 기준 완화: 리뷰 5건↑ 리셀러 OK, 중국계·인터내셔널·유한회사 제외, 설화수·에스티로더·랑콤 본사만. 슈퍼적립 가전 실습(가격비교 기준 포인트, 최저가-10원, 새 탭 열기, 세부 카테고리 요일 순환, 로보락 예시 역마진). 꼬리물기:가전 8:2, 30분 블록→45분·1시간 확장. 1~2주 뒤 선사입 안내."},
  {"name":"공미선","date":"2026-10-13","by": "뷰셀","url":"../gong-miseon-mkct/consult-261013/","summary":"코치 휴가로 대표가 원격 상담(65분). 저사양 PC로 원격 자주 끊김 → 종료 후 재부팅, 검색 1건 2분 가정. 대량등록 중 PC 꺼져 샴푸 4개 중 2개만 등록 추정 → 스토어 확인 후 사진 공유. 광고대행사 전화(월 20만 원)는 사기, 응대 금지·070 번호 변경. 시트: 같은 상품 3회 중복 소싱, 에누리 카탈로그 기재 → 네이버 카탈로그명·모두 4배소 표기, 찾으면 자동등록에 바로 담기, 구매 링크 저장 금지. 누아레모 OK, 안달로그·바디워시 2건 삭제. 색 규칙(빨강·취소선·파랑) 누락. 염색 샴푸 실습: 단일상품/카탈로그 구분, 묶음 쪼개기 배송비로 불가, 3개 28,800원 허위 구성·47,600÷3 마진 미달 패스. 하루 1시간은 적음, 2주차 강의 따라 하기, 쿠팡 무광고 경험 대비 꼬리물기 집중(선사입 옵션). 다음 주 컨설팅."},
  {"name":"이효인","date":"2026-10-13","by": "뷰셀","url":"../lee-hyoin-mnff/consult-261013/","summary":"숙제 완료·소싱 속도는 잡힘. 꼬리물기 시트에 키워드 미기재 + 위→아래 순서 진행 → 원인 추적 불가·할인 종료 상품 위주. 구분선 긋고 새로 기록: 꼬리물기만, 4방향 키워드 필수, 4방향 끝낸 뒤 최근 찾은 제품에서 이어가기, 같은 키워드 3개월 1회. 상품 324건(판매중 268)·미매칭 100건+ 대비 매출 적음 → 3주차대로 대량 매칭 신청, +/− 동시 표기 가격 수동 수정, 주말 가격관리 지속. 방치 역마진 주문은 3개월 배송 마감일에 일괄 취소(금액 무관). 평일 하루 20개(최소 10개, 슈퍼적립 활용). 공식 컨설팅 마지막 → 1~2주마다 셀수다에 시트 링크로 첨삭, 추가 컨설팅은 본인 고민."},
  {"name":"장유환","date":"2026-10-13","by": "뷰셀","url":"../jang-yuhwan-etxi/consult-261013/","summary":"6월 강의 후 석 달 공백, 추석특강으로 재시작. 집 PC 셀수다 접속 막힘(앱 ID·시크릿 창) → 자택 IP 미등록 확인·등록, 불명 IP 1개는 사무실에서 삭제. 코치가 자동등록(크롬 필수) 설치, 가격관리 가입·API 키·로그인 유지 세팅(상품 등록 후 상시 실행). 스토어 명의(가족)·강의 명의 불일치는 문제없음. 6월 테스트 등록 후 총판 전화에 겁먹고 중단 → 전화 미응답, 공기계 번호 그대로. 숙제: 2주차·추석특강 복습, 10/16(금)까지 하루 1~3시간 소싱, 주말 코치 컨설팅 신청(빈 시간 없으면 카톡으로 가능 시간 여러 개)."},
  {"name":"최연희","date":"2026-10-13","by": "뷰셀","url":"../choi-yeonhui-navn/consult-261013/","summary":"소싱 대신 네이버 소명 해결 우선. 할인 세타필 5건을 역마진(약 5만 원)으로 발송 → 실제 손해 증빙 필요, 판매장부 미작성. 구매처 추적: 롯데온(공식 확인), G마켓 1건은 네이버 가입 계정에서 비공식 구매(가품 판단) — 소명에서 제외 불가. 카드사 앱 결제내역으로 역추적. 코치가 소명서 작성·10/13 제출, 회신 오면 공유. 상품 등록 화면은 열림(정지 해제 가능성), 대량등록 오류 별도 확인. 원칙: 마이너스 발송 금지·공식에서만 구매·메일 확인. 숙제: 4배수 1개 찾기, 10/15(목) 18시 소싱 컨설팅(교육실장)."},
  {"name":"윤재령","date":"2026-10-13","by": "뷰셀","url":"../yun-jaeryeong-dcgd/consult-261013/","summary":"교육실장 휴가로 코치 원격 상담. 처음 해 보는 사입 건 처리: 주문 엑셀 받고 발주 확인 먼저, 사입은 주문 즉시 재고관리 입고 등록(G마켓 20개·개당 15,450원, 처음엔 소량 권장) 후 배송 요청 엑셀 업로드. 470ml 상품에 300ml 사진·고시 누락 → GPT·스마트에디터 ONE·리뷰 사진으로 수정. 정품 인증 메일은 소명 필요, 코치가 10/14까지 작성. 10/10 사입 물건 창고 확인 요청. 소싱 막힘으로 10/15(목) 16시 대면 컨설팅(교육실장)."},
  {"name":"이미정","date":"2026-10-13","by": "뷰셀","url":"../lee-mijeong-hubv/consult-261013/","summary":"새로 설치한 가격관리·대량등록 프로그램 원격 재세팅. 가격관리는 크롬 창 스마트스토어 로그인 후 창 유지, 밤에 노트북 덮지 않기·아침 재부팅. 예전 꼬리물기 기록을 못 찾아 처음부터: 네이버·에누리 3분의 2 배치, 배송비 포함·파란 최저가·카드할인, 싸도 본사(공식·브랜드=스토어명) 아니면 패스. 숙제: 2주차 강의 따라 하기, 베스트 1개 찾아 꼬리물기, 대량등록 확인."},
  {"name":"이수영","date":"2026-10-13","by": "뷰셀","url":"../lee-suyeong-ppoi/consult-261013/","summary":"강의를 거의 못 본 상태의 첫 대면 실습. 스킨케어 베스트로 소싱 전 과정 시연: 판매 구성은 메인+1개만, 네이버(10ml당)·에누리(배송비 포함·파란 최저가·카드할인) 비교, 사입은 +3,000원, 수수료 빼고 최소 1,000원·최저가 -10원, 싼 것 먼저 → 본사 3기준. 본 상품 전부 패스. 자동등록(카탈로그 담기→자리 비울 때 대량 등록) 안내. 숙제: 인베이더스쿨 2주차 강의, 실습 2~3시간, 꼬리물기 시트 공유 후 대면 컨설팅."},
  {"name":"최수현","date":"2026-10-13","by": "뷰셀","url":"../choi-suhyeon-dwfl/consult-261013/","summary":"매일 같은 시간을 써도 꼬리물기에서 상품이 안 나오는 상황. 방법은 대체로 맞지만 시트 날짜 차이와 건너뛴 구간 의심. 최근 찾은 것부터 아래→위, 리셀러 기준(중국·하이엔드 제외), 1만 원 이하·무거운 액체류 패스, 등록 정보는 카탈로그 제품 정보 기준. 시간 배분 꼬리물기 5시간+가전(G마켓 베스트) 1시간, 3일 뒤 스토어 추이 점검. 이틀간 매일 업무 끝 카톡·첨삭."},
  {"name":"김재명","date":"2026-10-12","by": "뷰셀","url":"../kim-jaemyeong-yqaj/consult-261012/","summary":"할인 없는·카탈로그 아닌 상품과 대량 구매 접근으로 역마진. 강사가 닥터포헤어 샴푸로 시작점 찍어 꼬리물기 재시작: 지칭 단어(브랜드 제외·고유명사 취소선), 제조사·브랜드는 1,000개 넘는 세부 카테고리까지. 에누리 실습(고객 배송비 3,000원 포함 계산), 가격 관리 프로그램 크롬 로그인 해결. 10/15(목) 카톡 중간 점검, 10/17(토) 19시 코치 컨설팅."},
  {"name":"이영선","date":"2026-10-12","by": "뷰셀","url":"../lee-yeongseon-eren/consult-261012/","summary":"지난주 잡은 뒤 2·3개 묶음까지 등록하며 기준이 흔들림. 등록은 메인 구성+1개만, 매입은 공식·홈쇼핑·판매자명=브랜드명만 재정립. 꼬리물기는 본 상품 기준·띄어쓰기, 세라마이드 샴푸 실습(전부 패스). 강사 확인: 9/30 반품 오수거(더마브릭), 현금영수증. 주말 문자, 1주 뒤 재점검."},
  {"name":"한미옥","date":"2026-10-12","by": "뷰셀","url":"../han-miok-agab/consult-261012/","summary":"설치 후 혼자 등록 단계에서 멈춘 상태. 커머스 API 연동 완료, 자동등록(카탈로그 담기→자기 전 대량 등록) 안내, 화면 배치·메인 키워드 검색·본사 기준 3가지 정리, 닥터 브로너스 슈퍼적립으로 마진 확인. 원격 클릭 불가로 10/20(화) 13시 방문 2시간. 숙제: 4배수홀 1페이지 80개, 구글 시트 공유."},
  {"name":"류민경","date":"2026-10-12","by": "뷰셀","url":"../ryu-mingyeong-rasm/consult-261012/","summary":"소싱이 멈춘 원인을 에누리 카탈로그 검색·판매가/매입가 기준 혼선으로 진단, 함께 30분에 4개 발견. 3일간 4배소(1페이지 80개)만 집중 후 꼬리물기, 상품당 30초~1분 타이머. 가격 관리 프로그램 세팅 완료, 역마진·주말 관리 정리. 10/15(목) 13시 교육실장 점검."},
  {"name":"이혜진","date":"2026-10-12","by": "뷰셀","url":"../lee-hyejin-sfai/consult-261012/","summary":"할인 소싱에 치우쳐 꼬리물기를 건너뜀. 카탈로그는 메인·1개짜리만, 하루 2:1(이상은 8:2) 배분, 리셀러 기준 완화(리뷰 5개↑, 하이엔드·중국 판매자 제외), 발주 5건 15분. 이번 주 매일 업무 종료 알림."},
  {"name":"우주형","date":"2026-10-12","by": "뷰셀","url":"../woo-juhyeong-sobc/consult-261012/","summary":"매출 들쑥날쑥 원인을 소싱 꼬임으로 진단, 바디케어 베스트부터 4배수홀 재시작. 쿠팡 제외·에누리+G마켓 30초, 세부 카테고리 금지, 동일 제조사·리뷰 10개 기준. 카드 없어도 구매대행 탭(수수료 5%)으로 소싱. 숙제: 가전 하루 1시간 30분, 10/19까지 매일 업무 끝 보고."},
  {"name":"허진구","date":"2026-10-11","by":"뿌요 교육실장","url":"../heo-jingu-rwpn/consult-261011/","summary":"입고 등록·배송 요청까지 혼자 완료. 셀수다 운송장 자동 발송처리와 실패 시 스마트스토어 직접 입력·배송중 확인법 정리, 판매장부 단가 입력. 꼬리물기 키워드 두 단어로 수정. 숙제: 하루 5개 소싱."},
  {"name":"김자영","date":"2026-10-10","by":"뿌요 교육실장","url":"../kim-jayeong-nmwd/consult-261010/","summary":"판매 중지 150여 개에 놀라 소싱이 멈춘 상태. 하루 1~2페이지씩 단계적으로 풀기, 바디로션 베스트 실습(뉴트로지나 2개 묶음 소싱), 지칭 단어·가로 진행 규칙. 숙제: 하루 2시간 5개."},

<script>
var all=JSON.parse(document.getElementById('data').textContent);
var people={};
all.forEach(function(r){(people[r.name]=people[r.name]||[]).push(r)});
var list=Object.keys(people).map(function(n){
  var rs=people[n].sort(function(a,b){return b.date.localeCompare(a.date)});
  return {name:n,reports:rs,last:rs[0].date,count:rs.length,by:rs[0].by,summary:rs[0].summary};
});
var sortKey='last',asc=false;
function fmt(d){var p=d.split('-');return (+p[1])+'/'+(+p[2])}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var bySel=document.getElementById('by');
Array.from(new Set(all.map(function(r){return r.by}))).forEach(function(b){
  var o=document.createElement('option');o.value=b;o.textContent=b;bySel.appendChild(o)});
function render(){
  var q=document.getElementById('q').value.trim().toLowerCase(), b=bySel.value;
  var rows=list.filter(function(p){
    if(b && !p.reports.some(function(r){return r.by===b})) return false;
    if(!q) return true;
    return (p.name+' '+p.reports.map(function(r){return r.summary+' '+r.by}).join(' ')).toLowerCase().indexOf(q)>-1;
  }).sort(function(x,y){
    var a=x[sortKey],c=y[sortKey],v=typeof a==='number'?a-c:String(a).localeCompare(String(c),'ko');
    if(v===0) v=x.name.localeCompare(y.name,'ko');
    return asc?v:-v;
  });
  document.getElementById('rows').innerHTML=rows.length?rows.map(function(p){
    return '<tr><td class="name">'+esc(p.name)+'</td><td><span class="who">'+esc(p.by)+'</span></td><td class="num">'+p.count+
      '</td><td>'+esc(p.last)+'</td><td><div class="links">'+p.reports.map(function(r,i){
        return '<a class="'+(i===0?'new':'')+'" href="'+esc(r.url)+'" target="_blank" rel="noopener" title="'+esc(r.by)+'">'+fmt(r.date)+'</a>'}).join('')+
      '</div></td><td class="sum">'+esc(p.summary)+'</td></tr>'}).join('')
    :'<tr><td colspan="6" class="empty">찾는 결과가 없습니다.</td></tr>';
}
document.querySelectorAll('th[data-sort]').forEach(function(th){
  th.addEventListener('click',function(){var k=th.dataset.sort;
    if(sortKey===k) asc=!asc; else {sortKey=k;asc=(k==='name'||k==='by')}
    render()})});
document.getElementById('q').addEventListener('input',render);
bySel.addEventListener('change',render);
document.getElementById('sPeople').textContent=list.length;
document.getElementById('sReports').textContent=all.length;
document.getElementById('sLast').textContent=all.map(function(r){return r.date}).sort().pop().slice(5).replace('-','/');
render();
</script>
